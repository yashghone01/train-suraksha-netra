<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Sense - Advanced Train Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            /* Fallback */
        }

        /* Video Background */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        #bg-video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.4);
        }

        /* Overlay Gradient */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 1;
        }

        /* Content */
        .hero {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: var(--text-main);
            padding: 20px;
        }



        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 1.2s ease-out;
        }

        p {
            font-size: 1.25rem;
            color: #cbd5e1;
            max-width: 600px;
            margin-bottom: 3rem;
            line-height: 1.6;
            animation: fadeIn 1.5s ease-out;
        }

        .cta-container {
            animation: fadeInUp 1s ease-out;
        }

        .btn {
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: #0f172a;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.5);
            background: #7dd3fc;
        }

        .features-grid {
            margin-top: 4rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
            max-width: 900px;
            animation: fadeIn 2s ease-out;
            align-items: start;
        }

        .train-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .feature-item {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            transition: transform 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .feature-item h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .feature-item p {
            font-size: 0.85rem;
            margin-bottom: 0;
            color: #94a3b8;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                max-width: 300px;
            }

            .feature-item {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="background_video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <script>
        // Force video play on load and handle manual loop fallback
        window.addEventListener('DOMContentLoaded', function () {
            var video = document.getElementById('bg-video');

            // Ensure muted is set (critical for autoplay)
            video.muted = true;

            video.play().catch(function (error) {
                console.log("Autoplay was prevented. User interaction might be required.", error);
            });

            // Manual loop fallback
            video.addEventListener('ended', function () {
                video.currentTime = 0;
                video.play();
            }, false);
        });
    </script>

    <div class="overlay"></div>

    <main class="hero">

        <span style="font-weight: 300; letter-spacing: 5px; text-transform: uppercase;">Train Suraksha Netra</span>
        </div>

        <h1>Rail Sense</h1>
        <p>Next-generation live telemetry and safety system for the modern railway infrastructure.</p>

        <!-- Button moved below Train Number 1 -->

        <div class="features-grid">
            <div class="train-column">
                <div class="feature-item">
                    <h3>Train Number 1</h3>

                </div>
                <div class="cta-container" style="margin-top: 1rem; animation: fadeInUp 1.2s ease-out;">
                    <a href="login.html" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1rem;">Initialize
                        Access</a>
                </div>
            </div>

            <div class="train-column">
                <div class="feature-item">
                    <h3>Train Number 2</h3>

                </div>
                <div class="cta-container" style="margin-top: 1rem; animation: fadeInUp 1.2s ease-out;">
                    <a href="login.html" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1rem;">Initialize
                        Access</a>
                </div>
            </div>

            <div class="train-column">
                <div class="feature-item">
                    <h3>Train Number 3</h3>

                </div>
                <div class="cta-container" style="margin-top: 1rem; animation: fadeInUp 1.2s ease-out;">
                    <a href="login.html" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1rem;">Initialize
                        Access</a>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
