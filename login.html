<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Rail Sense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="templatemo-daynight-style.css">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
    emailjs.init("x6te0TPIuX4sGFPsS");
})();
</script>

<style>
.otp-box{display:none;margin-top:15px}
</style>
</head>

<body>

<div class="login-page">
<div class="login-container">
<div class="login-card">

<h2 style="text-align:center">Rail Sense</h2>
<p style="text-align:center">Secure Login</p>

<form onsubmit="return startLogin()">

<div class="form-group">
<label>User ID</label>
<input id="username" class="form-input" placeholder=" " required>
</div>

<div class="form-group">
<label>Password</label>
<input id="password" type="password" class="form-input" placeholder="Enter password" required>
</div>

<div class="form-group">
<label>Email</label>
<input id="email" type="email" class="form-input" placeholder="your@email.com" required>
</div>

<button class="btn btn-primary" type="submit">Send OTP</button>

<div class="otp-box" id="otpBox">
<label>Enter OTP</label>
<input id="otp" class="form-input" placeholder="6 digit OTP">
<button type="button" class="btn btn-secondary" onclick="verifyOTP()">Verify & Login</button>
</div>

</form>

</div>
</div>
</div>

<script>
const users = {
    admin: "admin123",
    yash: "yash123"
};

let generatedOTP = "";

function startLogin(){
    const u = username.value.trim();
    const p = password.value.trim();
    const email = document.getElementById("email").value;

    if(!users[u] || users[u] !== p){
        alert("Invalid Username or Password");
        return false;
    }

    generatedOTP = Math.floor(100000 + Math.random()*900000).toString();

    emailjs.send("service_wzndr9s","template_boo0qsi",{
        otp: generatedOTP,
        email: email
    }).then(()=>{
        alert("OTP sent to your email");
        document.getElementById("otpBox").style.display="block";
    }).catch(err=>{
        alert("OTP sending failed");
        console.error(err);
    });

    return false;
}

function verifyOTP(){
    const userOTP = document.getElementById("otp").value.trim();

    if(userOTP === generatedOTP){
        localStorage.setItem("loggedIn","true");
        window.location.href="dashboard.html";
    }else{
        alert("Incorrect OTP");
    }
}
</script>

</body>
</html>
